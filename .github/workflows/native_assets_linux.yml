name: Native assets Linux check (Dart)

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  dart-native-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (C toolchain, ninja, zlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            clang \
            pkg-config \
            zlib1g-dev

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Pub get
        run: dart pub get

      - name: Run example to trigger native assets build
        run: dart run example/main.dart